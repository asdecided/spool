[package]
name = "asdecided-spool"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"
description = "Durable execution workspace for AI agents — local execution preview"

[[bin]]
name = "spool"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
